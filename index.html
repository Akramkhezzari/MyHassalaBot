<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🐷 حصالة إلكترونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --bg1:#f6f2ff;
    --bg2:#ffe9f3;
    --card:#ffffff;
    --primary:#7c3aed;
    --pink:#ec4899;
    --text:#1f1147;
    --muted:#7b7394;
    --green:#10b981;
    --danger:#ef4444;
    --line:#eee7fb;
  }

  body{
    font-family:'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:22px 14px 70px;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }

  .app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px;}

  .title{
    text-align:center;
    font-size:21px;
    font-weight:900;
    letter-spacing:-.3px;
  }
  .title span{color:var(--primary);}

  /* ===== البطاقة الرئيسية ===== */
  .hero{
    position:relative;
    overflow:hidden;
    border-radius:26px;
    padding:22px 22px 18px;
    background:linear-gradient(135deg,#7c3aed,#a855f7 45%,#ec4899);
    color:#fff;
    box-shadow:0 16px 36px rgba(124,58,237,.34);
  }
  .hero::after{
    content:"🐷";
    position:absolute;
    left:-10px;bottom:-22px;
    font-size:96px;
    opacity:.16;
    transform:rotate(-8deg);
    pointer-events:none;
  }
  .hero .label{
    font-size:13.5px;
    font-weight:600;
    opacity:.92;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .hero .total{
    font-size:42px;
    font-weight:900;
    letter-spacing:-1.5px;
    line-height:1.25;
    margin-top:2px;
    transition:transform .25s ease;
  }
  .hero .total.pop{transform:scale(1.08);}
  .hero .avg{
    margin-top:8px;
    font-size:13px;
    font-weight:600;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.25);
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .hero .avg.small{
    font-size:12px;
    padding:4px 10px;
    margin-top:6px;
    opacity:.9;
  }

  /* ===== البطاقات الصغيرة ===== */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mini{
    background:var(--card);
    border-radius:20px;
    padding:14px 16px;
    box-shadow:0 8px 26px rgba(80,40,140,.09);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .mini .k{font-size:12.5px;font-weight:600;color:var(--muted);}
  .mini .v{font-size:26px;font-weight:900;letter-spacing:-.5px;}
  .mini .v.purple{color:var(--primary);}
  .mini .v.pink{color:var(--pink);}
  .mini .sub{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    margin-top:4px;
    line-height:1.4;
  }
  .mini .sub b{color:var(--text);}

  /* ===== الإدخال ===== */
  .card{
    background:var(--card);
    border-radius:22px;
    padding:16px;
    box-shadow:0 8px 26px rgba(80,40,140,.09);
  }
  .card h2{
    font-size:15px;
    font-weight:800;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);}

  .inputRow{display:flex;gap:10px;}
  .inputWrap{position:relative;flex:1;}
  .inputWrap input{
    width:100%;
    font-family:inherit;
    font-size:19px;
    font-weight:700;
    color:var(--text);
    padding:13px 16px;
    border:2px solid var(--line);
    border-radius:16px;
    background:#fbf9ff;
    outline:none;
    transition:border-color .2s, background .2s;
  }
  .inputWrap input::placeholder{color:#b7b0cd;font-weight:600;font-size:16px;}
  .inputWrap input:focus{border-color:var(--primary);background:#fff;}

  button{font-family:inherit;cursor:pointer;border:none;transition:transform .12s, filter .2s;}

  .btnAdd{
    padding:0 24px;
    border-radius:16px;
    font-size:16px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    box-shadow:0 8px 20px rgba(124,58,237,.32);
    white-space:nowrap;
  }
  .btnAdd:active{transform:scale(.96);}

  .btnSmall{
    padding:0 16px;
    font-size:14px;
    border-radius:14px;
  }

  .msg{
    margin-top:10px;
    font-size:13px;
    font-weight:700;
    color:var(--danger);
    min-height:18px;
    opacity:0;
    transition:opacity .2s;
  }
  .msg.show{opacity:1;}
  .msg.ok{color:var(--green);}

  /* ===== السجل ===== */
  .list{display:flex;flex-direction:column;gap:9px;max-height:330px;overflow-y:auto;padding-left:2px;}
  .list::-webkit-scrollbar{width:6px;}
  .list::-webkit-scrollbar-thumb{background:#ded3f7;border-radius:9px;}

  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 13px;
    border-radius:16px;
    background:#faf8ff;
    border:1px solid var(--line);
    animation:fadeIn .28s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

  .item .amount{
    font-size:17px;
    font-weight:900;
    color:var(--green);
    white-space:nowrap;
  }
  .item .date{
    flex:1;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    text-align:left;
  }
  .del{
    background:#fee2e2;
    color:var(--danger);
    width:32px;height:32px;
    border-radius:11px;
    font-size:16px;
    font-weight:900;
    display:grid;place-items:center;
    flex-shrink:0;
  }
  .del:active{transform:scale(.9);}

  .empty{
    text-align:center;
    padding:24px 10px;
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    line-height:2;
  }
  .empty .big{font-size:38px;display:block;margin-bottom:4px;}

  .btnReset{
    width:100%;
    margin-top:12px;
    padding:12px;
    border-radius:16px;
    font-size:14px;
    font-weight:800;
    color:var(--danger);
    background:#fff1f1;
    border:1.5px dashed #f8c9c9;
  }
  .btnReset:active{transform:scale(.98);}

  footer{
    text-align:center;
    font-size:11.5px;
    color:#a79fc0;
    font-weight:600;
    margin-top:4px;
  }
</style>
</head>
<body>

<div class="app">

  <h1 class="title">🐷 حصالة <span>إلكترونية</span></h1>

  <!-- الإجمالي -->
  <div class="hero">
    <div class="label">💰 المبلغ الإجمالي في الحصالة</div>
    <div class="total" id="total">0.00</div>
    <div class="avg small"> أيام المتابعة: <b id="daysSinceStart">0</b></div>
  </div>

  <!-- الأيام والعدد -->
  <div class="grid2">
    <div class="mini">
      <div class="k"> أيام التوفير يومياً 6000 </div>
      <div class="v purple" id="days">0</div>
      <div class="sub">المتبقي لليوم التالي: <b id="remaining">6000</b></div>
    </div>
    <div class="mini">
      <div class="k">🧾 عدد الإيداعات</div>
      <div class="v pink" id="count">0</div>
    </div>
  </div>

  <!-- إضافة مبلغ -->
  <div class="card">
    <h2><span class="dot"></span> أودِع مبلغًا في الحصالة</h2>
    <div class="inputRow">
      <div class="inputWrap">
        <input id="amount" type="text" inputmode="decimal" placeholder="اكتب المبلغ..." autocomplete="off">
      </div>
      <button class="btnAdd" id="addBtn">أضِف</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- السجل -->
  <div class="card">
    <h2><span class="dot"></span> سجل الإيداعات</h2>
    <div class="list" id="list"></div>
    <button class="btnReset" id="resetBtn">🗑️ حذف كل السجل والبدء من جديد</button>
  </div>

  <footer>البيانات محفوظة تلقائيًا في متصفحك 🔒</footer>
</div>

<script>
(function () {
  "use strict";

  const KEY = "piggyBank_v1";
  const DAILY_GOAL = 6000; // الهدف اليومي الثابت
  const $ = (id) => document.getElementById(id);

  const elTotal = $("total");
  const elDays  = $("days");
  const elCount = $("count");
  const elAvg   = $("avg");
  const elDaysSinceStart = $("daysSinceStart");
  const elRemaining = $("remaining");
  const elList  = $("list");
  const elInput = $("amount");
  const elMsg   = $("msg");

  /* ---------- التخزين ---------- */
  let data = { deposits: [] };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.deposits)) {
          data.deposits = parsed.deposits.filter(
            (d) => d && typeof d.amount === "number" && typeof d.date === "string"
          );
        }
      }
    } catch (e) { /* تجاهل */ }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  /* ---------- أدوات ---------- */
  function todayStr() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function parseDate(s) {
    const p = s.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function fmtMoney(n) {
    return Number(n).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function fmtInt(n) {
    return Number(n).toLocaleString("en-US", {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    });
  }

  function fmtDate(s) {
    try {
      return parseDate(s).toLocaleDateString("ar-DZ", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    } catch (e) { return s; }
  }

  // تحويل الأرقام العربية/الفارسية والفاصلة إلى صيغة قابلة للحساب
  function normalizeNum(str) {
    const ar = "٠١٢٣٤٥٦٧٨٩";
    const fa = "۰۱۲۳۴۵۶۷۸۹";
    let out = "";
    for (const ch of String(str)) {
      let i = ar.indexOf(ch);
      if (i > -1) { out += i; continue; }
      i = fa.indexOf(ch);
      if (i > -1) { out += i; continue; }
      if (ch === "," || ch === "٫" || ch === "٬") { out += "."; continue; }
      if (ch === " ") continue;
      out += ch;
    }
    return out;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function showMsg(el, text, ok) {
    el.textContent = text;
    el.classList.toggle("ok", !!ok);
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* ---------- العرض ---------- */
  function render() {
    const deposits = data.deposits;

    const total = deposits.reduce((s, d) => s + d.amount, 0);
    elTotal.textContent = fmtMoney(total);
    elCount.textContent = deposits.length;

    // عدد الأيام منذ أول إيداع (للمتوسط)
    let daysSinceStart = 0;
    if (deposits.length) {
      const times = deposits.map((d) => parseDate(d.date).getTime());
      const first = Math.min.apply(null, times);
      const now = parseDate(todayStr()).getTime();
      daysSinceStart = Math.floor((now - first) / 86400000) + 1;
      if (daysSinceStart < 1) daysSinceStart = 1;
    }
    elDaysSinceStart.textContent = daysSinceStart;
    elAvg.textContent = fmtMoney(daysSinceStart > 0 ? total / daysSinceStart : 0);

    // أيام التوفير بناءً على الهدف اليومي الثابت
    const daysSaved = Math.floor(total / DAILY_GOAL);
    elDays.textContent = daysSaved;

    // المتبقي لليوم التالي
    const remainder = total % DAILY_GOAL;
    const remaining = (remainder === 0 && total > 0) ? 0 : (DAILY_GOAL - remainder);
    elRemaining.textContent = fmtMoney(remaining);

    // السجل (الأحدث أولًا)
    const sorted = deposits.slice().sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts || 0) - (a.ts || 0);
    });

    if (!sorted.length) {
      elList.innerHTML =
        '<div class="empty"><span class="big">🐷</span>الحصالة فارغة حاليًا...<br>ابدأ بإيداع أول مبلغ!</div>';
      return;
    }

    elList.innerHTML = sorted.map((d) =>
      '<div class="item">' +
        '<div class="amount">+ ' + fmtMoney(d.amount) + '</div>' +
        '<div class="date">' + fmtDate(d.date) + '</div>' +
        '<button class="del" data-id="' + d.id + '" title="حذف">✕</button>' +
      '</div>'
    ).join("");
  }

  /* ---------- الإضافة ---------- */
  function addDeposit() {
    const raw = normalizeNum(elInput.value).trim();

    if (raw === "") {
      showMsg(elMsg, "⚠️ اكتب المبلغ أولًا");
      elInput.focus();
      return;
    }

    const amount = parseFloat(raw);

    if (!isFinite(amount) || amount <= 0) {
      showMsg(elMsg, "⚠️ المبلغ غير صحيح، اكتب رقمًا أكبر من صفر");
      elInput.select();
      return;
    }

    const value = Math.round(amount * 100) / 100;

    data.deposits.push({
      id: uid(),
      amount: value,
      date: todayStr(),
      ts: Date.now()
    });

    save();
    render();

    elInput.value = "";
    elInput.focus();

    elTotal.classList.add("pop");
    setTimeout(() => elTotal.classList.remove("pop"), 260);

    showMsg(elMsg, "✅ تم إيداع " + fmtMoney(value) + " بنجاح", true);
  }

  /* ---------- الأحداث ---------- */
  $("addBtn").addEventListener("click", addDeposit);

  elInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addDeposit(); }
  });

  elList.addEventListener("click", function (e) {
    const btn = e.target.closest(".del");
    if (!btn) return;
    const id = btn.dataset.id;
    const item = data.deposits.find((d) => d.id === id);
    if (!item) return;

    if (confirm("هل تريد حذف هذا الإيداع (" + fmtMoney(item.amount) + ") ؟")) {
      data.deposits = data.deposits.filter((d) => d.id !== id);
      save();
      render();
    }
  });

  $("resetBtn").addEventListener("click", function () {
    if (!data.deposits.length) { showMsg(elMsg, "السجل فارغ بالفعل"); return; }
    if (confirm("هل أنت متأكد من حذف كل السجل؟ لا يمكن التراجع!")) {
      data.deposits = [];
      save();
      render();
      showMsg(elMsg, "🗑️ تم حذف كل السجل", true);
    }
  });

  /* ---------- الإقلاع ---------- */
  load();
  render();
  elInput.focus();
})();
</script>
</body>
</html>
